name: Build Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes main.py app core models ui scripts tests

      - name: Smoke import check
        run: python -c "import app.config, app.database, app.theme, core.agent, models, ui.main_window; print('imports OK')"

      - name: Build single-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CodeAgent `
            --icon "resources\icons\app.ico" --add-data "resources;resources" `
            --hidden-import openai --hidden-import docker --hidden-import git `
            --hidden-import whoosh --hidden-import pathspec --hidden-import pytesseract `
            --hidden-import speech_recognition --hidden-import keyboard --hidden-import psutil `
            --hidden-import dotenv --hidden-import markdown --hidden-import pygments `
            --hidden-import aiosqlite main.py
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "scripts\build_installer.iss"'
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeAgent-windows
          path: |
            dist/CodeAgent.exe
            dist/CodeAgent-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeAgent-Setup-*.exe
          generate_release_notes: true
