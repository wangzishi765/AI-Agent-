name: Build Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes main.py app core models ui scripts tests

      - name: Determine version
        shell: pwsh
        run: |
          $fileVer = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVer = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tagVer -ne $fileVer) {
              throw "Tag v$tagVer 与 VERSION($fileVer) 不一致，请先更新 VERSION 文件再打 tag"
            }
            $v = $tagVer
          } else {
            $v = $fileVer
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "构建版本：$v"

      - name: Smoke import check
        run: python -c "import app.config, app.database, app.theme, core.agent, models, ui.main_window; print('imports OK', __import__('app.constants', fromlist=['APP_VERSION']).APP_VERSION)"

      - name: Build single-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CodeAgent `
            --icon "resources\icons\app.ico" --add-data "resources;resources" --add-data "VERSION;." `
            --hidden-import openai --hidden-import docker --hidden-import git `
            --hidden-import whoosh --hidden-import pathspec --hidden-import pytesseract `
            --hidden-import speech_recognition --hidden-import keyboard --hidden-import psutil `
            --hidden-import dotenv --hidden-import markdown --hidden-import pygments `
            --hidden-import aiosqlite main.py
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:APP_VERSION "scripts\build_installer.iss"'
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeAgent-windows
          path: |
            dist/CodeAgent.exe
            dist/CodeAgent-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeAgent-Setup-*.exe
          generate_release_notes: true
